<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert JavaScript</title>
</head>
<style>
    button {
        background-color: aqua;
        color: black;
        padding: 10px;
        margin: 10px;
        padding-left: 10px;
        font-size: larger;
        font-family: sans-serif;
    }

    a {
        font-size: larger;
        font-family: sans-serif;
    }
</style>
<script>
    alert("Halo Dunia");
</script>
<body>
    <h1 align="center">Alert JavaScript</h1>

    <li><button onclick="alert('Kezia Samantha')">KLIK</button></li>

    <li><button onclick="alert('Halo Dunia')">KLIK</button></li>

    <li><button onclick="alert('Halo Indonesia')">KLIK</button></li>

    <li><button onclick="alert('Elizabeth')">KLIK</button></li>

    <li><b><a href="javascript:alert('Hizkia Adiwangasa Sahono')">KLIK</a></b></li>
    
    <li><b><a href="javascript:alert('Halo aiman')">KLIK</a></b></li>
</body>
</html>
