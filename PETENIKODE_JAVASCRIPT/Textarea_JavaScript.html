<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea JavaScript</title>
</head>
<body>
    <textarea onkeyup="document.getElementById('saya').innerHTML = this.value.length" cols="20" rows="10"></textarea>

    <p>Panjang : <span id="saya">0</span></p>
</body>
</html>
