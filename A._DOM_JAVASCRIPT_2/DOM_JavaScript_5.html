<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM JavaScript 5</title>
</head>

<body>
    <h1>DOM JavaScript 5</h1>

    <p>Belajar JavaScript X HTML DOM.</p>

    <div id="myDiv"></div>
    <div id="p"></div>

    <script>
        let f = document.getElementById ("myDiv");
        f.innerHTML = "<p>Kekaisaran Romawi Barat runtuh karena gabungan faktor internal dan eksternal yang kompleks, meliputi kemunduran ekonomi dan pertanian, ketidakstabilan politik, perpecahan sosial, krisis militer yang diakibatkan oleh ketergantungan pada tentara bayaran, serta serangan dan migrasi bangsa-bangsa barbar seperti Suku Vandal dan Suku Hun. Keruntuhan ini berpuncak pada tahun 476 M ketika panglima perang Jermanik, Odoacer, menggulingkan kaisar terakhir Romawi Barat, Romulus Augustulus.</p>";

        let j = document.getElementById ("p");
        j.innerHTML = "<p>Romawi Timur (Bizantium) runtuh karena kombinasi-kombinasi faktor eksternal dan internal, termasuk gempuran bangsa-bangsa Muslim (terutama Turki Utsmani) yang memuncak dengan penaklukan Konstantinopel pada tahun 1453, keruntuhan ekonomi akibat inflasi dan perpajakan yang tinggi, konflik militer yang berkepanjangan, serta masalah sosial internal seperti korupsi dan perpecahan di tubuh gereja.</p>";
    </script>
</body>
</html>
