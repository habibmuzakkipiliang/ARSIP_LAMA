<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Button</title>
</head>
<body>
    <h1>DOM Button</h1>

    <p>SEMANGAT</p>

    <button onclick="chart()">Click Me!</button>
    <p id="met"></p>

    <script>
        function chart() {
            document.getElementById ("met");
            met.innerHTML += "SEMANGAT ";
        }
    </script>
</body>
</html>
