<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM JavaScript</title>
</head>
<body>
    <h1>DOM JavaScript</h1>

    <button onclick="razor()">Click me</button>
    <p id="razor"></p>

    <button onclick="plant()">Click of me</button>
    <p id="plant"></p>

    <script>
        function razor() {
            let v = document.getElementById ("razor")
            v.innerHTML += "<p>Halo James</p>"
        }
    </script>

    <script>
        function plant() {
            let y = document.getElementById ("plant")
            y.innerHTML += "<p>Halo Kezia dan Anak Petra 1</p>"
        }
    </script>

</body>
</html>
