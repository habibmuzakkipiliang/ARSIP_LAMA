<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana JavaScript</title>
</head>
<body>
    <h1 align="center">Kalkulator Sederhana JavaScript</h1>
    <p>Saya sedang belajar JavaScript di Medan Developer</p>
    <p>Belajar Web Programming di Medan Developer</p>

    <script>
        function tambah(a,b)
        {return a + b;}console.log(tambah(5,10));

        function kurang(a,b)
        {return a - b;}console.log(kurang(10,5));

        function kali(a,b)
        {return a * b;}console.log(kali(100,500));

        function bagi(a,b)
        {return a / b}console.log(bagi(20,5))
    </script>
</body>
</html>
