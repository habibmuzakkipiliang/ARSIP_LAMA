<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Contoh Halaman</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .back-to-top {
      position: fixed;
      bottom: 40px;
      right: 40px;
      display: none;
      z-index: 9999;
      border-radius: 50%;
      padding: 12px 16px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- Konten halaman -->
  <div class="container mt-5">
    <h1>Selamat datang</h1>
    <p>(Konten sangat panjang sampai bisa scroll ke bawah)</p>
    <div style="height: 2000px;"></div> <!-- Simulasi konten panjang -->
  </div>

  <!-- 🔽 Tambahkan elemen panah DI SINI -->
  <a href="#" class="btn btn-primary back-to-top" role="button">
    <i class="bi bi-arrow-up"></i>
  </a>

  <!-- Script Bootstrap (opsional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script untuk tampilkan tombol saat scroll -->
  <script>
    window.addEventListener("scroll", function () {
      const backToTop = document.querySelector(".back-to-top");
      if (window.scrollY > 300) {
        backToTop.style.display = "block";
      } else {
        backToTop.style.display = "none";
      }
    });

    // Scroll halus ke atas saat diklik
    document.querySelector(".back-to-top").addEventListener("click", function (e) {
      e.preventDefault();
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
</html>
