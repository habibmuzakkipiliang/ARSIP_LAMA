    <script>

    <script>
        var i = 12;
        var n = 50;
        var k = 0;

        k = n + i;
        document.write (`${n} + ${i} = ${k} <br>`);

        k = n - i;
        document.write (`${n} - ${i} = ${k} <br>`);

        k = n ** i;
        document.write (`${n} ** ${i} = ${k} <br>`);

        k = n < i;
        document.write (`${n} < ${i} = ${k} <br>`);

        k = n > i;
        document.write (`${n} > ${i} = ${k} <br>`);

        k = n && i;
        document.write (`${n} && ${i} = ${k} <br>`);

        k = n / i;
        document.write (`${n} / ${i} = ${k} <br>`);

        k = n % i;
        document.write (`${n} % ${i} = ${k} <br>`);

        k = n ^ i;
        document.write (`${n} ^ ${i} = ${k} <br>`)
    </script>

    <script>
        var k = prompt ("Masukkan data kamu");

        if (k > 100) {
            document.write ("<p>BENAR</p>")
        }

        else if (k < 87) {
            document.write ("<p>SALAH</p>");
        }

        else if (k < 85 ) {
            document.write ("<p>SALAH</p>");
        }

        else {
            document.write ("<p>SAMA SAJA</p>");
        }
    </script>

    <script>
        for (let u = 0; u < 10; u++) {

        for (let unik = 0; unik < 10; unik++) {
            document.write ("<p>Perulangan ke-</p>" + unik + "<br>")
        }
    </script>
