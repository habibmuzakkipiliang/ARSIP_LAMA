<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan JavaScript</title>
</head>
<body>
    <h1>Perulangan JavaScript</h1>

    <script>

        for (let i = 0; i < 10; i++) {
            document.write ("Perulangan ke-" + i + "<br>");
        }

        for (let t = 0; t < 5; t++) {
            document.write("<p>Perulangan ke-</p>" );
        }

        for (let b = 0; b < 10; b++) {
            document.write ("<p>PERULANGAN PERLUANG</p>")
        }

        for (let k = 0; k < 3; k++) {
            document.write ("<p>PERULANGAN LAGI</p>")
        }

        for (let koper = 0; koper < 10; koper++) {
            document.write ("<p>urutan ke-</p>" + koper)
        }
    </script>
</body>
</html>
