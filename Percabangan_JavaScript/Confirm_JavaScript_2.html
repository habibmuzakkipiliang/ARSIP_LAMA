<head>

    <title>Confirm JavaScript 2</title>
</head>
<body>
    <h1>Confirm JavaScript 2</h1>

    <script>

        if (input) {

        }

        else {
            document.write ("Tidak");
        }

        document.write ("<p> kamu tetap disini saja ya </p>")
    </script>
</body>
</html>
