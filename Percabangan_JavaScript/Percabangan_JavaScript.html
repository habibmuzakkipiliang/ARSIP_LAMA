<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percabangan JavaScript</title>
</head>
<body>
    <h1>Percabangan JavaScript</h1>

    <script>
        var password = prompt ("Password");
        
        if (password > 100) {
            document.write ("Besar")
        }

        else if (password < 100) {
            document.write ("Kecil")
        }

        else {
            document.write ("sama saja")
        }

        document.write ("<p> terimakasih sudah dikunjungi halaman ini </p>")
    </script>
</body>
</html>
