<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percabangan Ternary JavaScript</title>
</head>
<body>
    <h1>Percabangan Ternary JavaScript</h1>

    <script>
        var pengguna = prompt ("Masukkan data kamu");
        var password = prompt ("Masukkan password kamu");

        if (pengguna == "Habib") {
            if (password == "12345") {
                document.write ("<h2> Selamat datang di Aplikasi Aku");
            } 
            
            else {
                document.write ("<p> anda salah  </p>");
            }
        } 
        
        else {
            document.write ("<p> Pengguna tidak terdaftar </p>");
        }
    </script>
</body>
</html>
