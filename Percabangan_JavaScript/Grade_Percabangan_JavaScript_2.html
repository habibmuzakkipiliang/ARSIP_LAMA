<html lang="en">
<head>

    <title>Percabangan JavaScript 2</title>
</head>
<body>
    <h1>Percabangan JavaScript 2</h1>

    <script>
        var input = prompt ("Input data ini");
        var isi = "";

        if (input > 100) grade = "A+";
        else if (input < 95) grade = "B+";
        else if (input < 90) grade = "B-";
        else if (input < 85) grade = "B";
        else if (input < 80) grade = "C";
        else if (input < 75) grade = "D";
        else if (input < 70) grade = "E";
        else grade = "f";

        document.write (`<p> grade anda : ${grade}`);
    </script>
</body>
