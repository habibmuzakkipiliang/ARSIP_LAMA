<body>

    <script>
        var input = prompt ("Masukkan nama kamu");

        if (input == "Petanikode") {
            if (password == "123") {
                document.write ("<h1> Selamat datang di Program saya")
            }

            else {
                document.write ("<p> Anda salah </p>")
            }
        }

        else {
            document.write ("<p> Anda tidak terdaftar </p>")
        }
