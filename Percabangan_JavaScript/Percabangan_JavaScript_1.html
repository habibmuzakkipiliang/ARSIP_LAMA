<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percabangan JavaScript 1</title>
</head>
<body>
    <h1>Percabangan JavaScript 1</h1>

    <script>
        var data = prompt ("Masukkan datanya")
        var grade = "";

        if (data > 100) {
            document.write ("Besar")
        }

        else if (data < 100) {
            document.write ("Kecil")
        }

        else {
            document.write ("Sama saja")
        }

        document.write ("<p>Terimakasih banyak ya !!!</p>")
    </script>
</body>
</html>
