<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm JavaScript</title>
</head>
<body>

    <h1>Confirm JavaScript</h1>

    
    <script>
        let name = confirm("Pilih yang jika aku ingin kembali");
        
        if (name) {
            document.write ("Iya")
        }

        else {
            document.write ("tidak")
        }

        document.write ("<p> terimakasih sudah memilih ya </p>")
    </script>
</body>
</html>
