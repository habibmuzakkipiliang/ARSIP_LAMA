<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percabangan Logika Ternary JavaScript</title>
</head>
<body>
    <h1>Percabangan Logika Ternary JavaScript</h1>

    <script>
        var nama = prompt ("Masukkan nama kamu");
        var kode = prompt ("Masukkan kode kamu");

        if (nama == "Habib" && kode == "123") {
            document.write ("<h1> Selamat datang di program saya")
        } 
        
        else {
            document.write ("<p> Anda salah </p>");
        }
    </script>
</body>
</html>
