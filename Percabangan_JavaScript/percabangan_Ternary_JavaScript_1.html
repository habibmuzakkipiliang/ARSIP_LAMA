<body>

    <script>
        var data = prompt ("Masukkan data kamu");

        if (data == "Habib") {
           if (password == "12345") {
            document.write ("<h1> Selamat datang di Website")
           } 
           
           else {
            document.write ("<p> salah </p>")
           } 

        } 
        
        else {
            document.write ("<p> anda tidak terdaftar </p>")
        }
    </script>
