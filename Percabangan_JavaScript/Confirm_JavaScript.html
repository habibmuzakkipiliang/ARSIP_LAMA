<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm JavaScript</title>
</head>
<body>

    <h1>Confirm JavaScript</h1>
    
    <script>
        // confirm JavaScript

        var yakin = confirm("Sayang, kamu yakin ingin nikahi aku ??")

        if (yakin) {
            document.write ("Iya, aku mau")
        }

        else {
            document.write ("Tidak")
        }

        document.write ("<p> terimakasih sudah memilih</p>")
    </script>
</body>
</html>
