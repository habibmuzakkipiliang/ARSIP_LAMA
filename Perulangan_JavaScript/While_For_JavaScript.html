<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For dan while dan do while</title>
</head>
<body>
    <h1>For dan while dan do while</h1>
    <script>
        document.write ("<br><br>")

        // for 

        let ang = 5;

        for (ang = 0; ang < 10; ang++) {
            document.write(ang + "Perulangan" + "<br>")
        }

        document.write ("<br><br>")

        // while 

        let wh = 4;
    
        while (wh < 10) {
            document.write(wh + "Ulang" + "<br>")
            wh++
        }

        document.write ("<br><br>")

        // do while

        let kop = 5;

        do {
            document.write(kop + "<br>")
            kop++;
        } while (kop < 10) 

        document.write ("<br><br>")
    </script>
</body>
</html>
