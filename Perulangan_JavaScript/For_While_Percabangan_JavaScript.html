<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For While Percabangan JavaScript</title>
</head>
<body>
    <h1>For While Percabangan JavaScript</h1>
    <script>
        // percabangan JavaScript
        let juka = 10;

        if (juka < 15) {
            document.write ("Benar")
        }

        else if (juka < 10) {
            document.write ("Salah")
        }

        else {
            document.write ("Bukan Keduanya")
        }

        document.write ("<br><br>")

        // Percabangan Nested

        let anghu = 34;
        let angku = true

        if (anghu < 34) {
            if (angku) {
                document.write ("Besar")
            }

            else {
                document.write ("Kecil")
            }
        }

        else {
            document.write ("Lebih Kecil")
        }

        document.write ("<br><br>")

        // for perulangan

        let foo = 1;

        for (foo = 1; foo < 10; foo++) {
            document.write (foo + "<br>");
        }

        document.write ("<br><br>")

        // while perulangan
        let jur = 10;

        while (jur < 15) {
            document.write (jur + "<br>")
            jur++;
        }

        document.write ("<br><br>")

        // do while 

        let juki = 10;

        do {
            document.write (juki + "<br>")
            juki++
        } while (juki < 15);

    </script>
</body>
</html>
