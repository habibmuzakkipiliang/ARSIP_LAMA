<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan for while dan do while JavaScript</title>
</head>
<body>
    <h1>Perulangan for while dan do while JavaScript</h1>

    <script>
        // for 

        let juko = 1;

        for (juko = 1; juko < 10; juko++) {
            document.write (juko + "Perulangan" + "<br>")
        }

        document.write ("<br><br>")
        

        // while

        let jio = 1;
        
        while (jio < 10) {
            document.write (jio + "Ulas" + "<br>")
            jio++
        } 

        document.write ("<br><br>")

        // do while

        let kop = 5;

        do {
            document.write (kop + "do" +"<br>")
            kop++
        } while (kop < 10);


    </script>
</body>
</html>
