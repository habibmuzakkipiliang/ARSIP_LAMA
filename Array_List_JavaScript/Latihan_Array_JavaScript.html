<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Array JavaScript</title>
</head>
<body>
    <script>
        var makanan = ["Ayam", "Mie Goreng", "Mie Ayam", "Bakwan"];

        document.write ("<h1>JENIS-JENIS MAKANAN</h1>")
        document.write ("<ol>")
            for (let i = 0; i < makanan.length; i++) {
                document.write (`<li> ${makanan[i]} </li>`);
            }

            document.write ("</ol>")
    </script>
    <p></p>

    <script>

            }

    <script>

    <p></p>

    <script>

                document.write (`<li> ${jenis_tumbuhan[l]}</li>`)
            }

            document.write ("</ol>")
    </script>
</body>
</html>
