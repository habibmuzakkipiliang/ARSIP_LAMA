<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Array JavaScript 20</title>
</head>
<body>
     <script>
        document.write ("<h1>Bahasa Pemrograman populer dan mudah dipelajari dan ramah pemula</h1>");

        var ijit = ["Python", "JavaScript", "Scratch", "Ruby", "Lua", "Kotlin", "GoLang"];

        document.write ("<ol>")
            for (var coding = 0; coding < ijit.length; coding++) {
                document.write (`<li> ${ijit[coding]}</li>`)
            }
        document.write ("</ol>")
    </script>

    <script>
        document.write ("<h1>KARAKTER DARI QUANTUM HEROES DINOSTER</h1>")

        var intel = ["Lucio", "Delby", "Jay Min", "Oz", "Trina"];

        document.write ("<ol>")
            for (var i = 0; i < intel.length; i++) {
                document.write (`<li> ${intel[i]}</li>`)
            }
        document.write ("</ol>")
    </script>

    <script>
        document.write ("<h1>KARAKTER EJEN ALI</h1>");

        var ejen = ["Ali", "Alicia", "Bakar", "Comot", "Rizwan"];

        document.write ("<ol>")
            for (var ml = 0; ml < ejen.length; ml++){
                document.write (`<li> ${ejen[ml]}</li>`)
            }
        document.write ("</ol>")
    </script>
</body>
</html>
