<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>
    <h1>Array JavaScript</h1>

    <script>
        var nama_karakter = ["Gru", " Agnes", " Margo", " Edith"]
        console.log (nama_karakter);
        document.write (nama_karakter);

        var nama_orang = ["Budi", " Siti", " Riyan", " Hayyan"]
        console.log (nama_orang);
        document.write ("<br>" + nama_orang);
    </script>
</body>
</html>
