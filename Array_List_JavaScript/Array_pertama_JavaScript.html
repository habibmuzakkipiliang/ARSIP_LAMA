<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array JavaScript</title>
</head>
<body>
    <h1>Array JavaScript</h1>

    <script>
        var sayur = ["Bayam", " Kangkung", " Sawi", " Brokoli"]
        console.log (sayur);
        document.write (sayur);
    </script>
    <script>
        var buah = ["Jeruk", " Apel", " Mangga", " Pisang", " Nanas"]
        console.log (buah);
        document.write ("<br>" + buah);
    </script>
    <script>
        var hewan = ["Sapi", " kerbau", " Kucing", " Burung Elang", " Bison"]
        console.log (hewan);
        document.write ("<br>" + hewan);
    </script>
    <script>
        var sekolah = ["SD", " SMP", " SMA", " D1", " D2", " D3", " S1", " S2", " S3"];
        console.log (sekolah);
        document.write ("<br>" + sekolah);
    </script>
</body>
</html>
