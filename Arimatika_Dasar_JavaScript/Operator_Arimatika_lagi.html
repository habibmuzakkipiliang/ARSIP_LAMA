<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Arimatika lagi</title>
</head>
<body>
    <h1>Operator Arimatika lagi</h1>

    <script>
        let a = 90;
        let j = 80;
        let k = 0;

        c = a + j
        document.write (`${a} + ${j} = ${c} <br>`)

        c = a - j
        document.write (`${a} - ${j} = ${c} <br>`)

        c = a * j
        document.write (`${a} * ${j} = ${c} <br>`)

        c = a / j
        document.write (`${a} / ${j} = ${c} <br>`)

        c = a % j
        document.write (`${a} % ${j} = ${c} <br>`)

        c = a ** j 
        document.write (`${a} ** ${j} = ${c}`)
    </script>
</body>
</html>
