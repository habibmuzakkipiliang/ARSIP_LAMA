<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Penugasan</title>
</head>
<body>
    <h1>Operator Penugasan</h1>

    <script>
        document.write ("Mula-mula score <br>");

        var nilai = 100;
        document.write ("Nilai " + nilai + "<br>");

        nilai += 23;
        document.write ("Nilai " + nilai + "<br>");

        nilai -= 23;
        document.write ("Nilai " + nilai + "<br>");

        nilai *= 400;
        document.write ("Nilai " + nilai + "<br>");

        nilai **= 4;
        document.write ("Nilai " + nilai + "<br>");

        nilai /= 12;
        document.write ("Nilai " + nilai + "<br>");
    </script>
</body>
</html>
