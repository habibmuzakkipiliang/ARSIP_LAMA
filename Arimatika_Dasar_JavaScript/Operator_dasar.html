<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Aritmatika JS</title>
</head>
<body>
    <h1>Operator Aritmatika JS</h1>

    <script>
        var a = 12;
        var b = 30;
        var c = 0;

        c = a + b;
        document.write (`${a} + ${b} = ${c} <br>`);

        c = a * b;
        document.write (`${a} * ${b} = ${c} <br>`);

        c = a / b;
        document.write (`${a} / ${b} = ${c} <br>`);

        c = a ** b;
        document.write (`${a} ** ${b} = ${c} <br>`);

        c = a % b;
        document.write (`${a} % ${b} = ${c} <br>`);

        c = a ^ b;
        document.write (`${a} ^ ${b} = ${c} <br>`);
    </script>
</body>
</html>
