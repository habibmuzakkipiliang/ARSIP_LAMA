<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arimatika lagi</title>
</head>
<body>
    <h1></h1>

    <script>
        let x = 100;
        let y = 89;
        let z = 0;

        // penjumlahan
        z = x + y
        document.write (`${x} + ${y} = ${z} <br>`)

        // pengurangan
        z = x - y
        document.write (`${x} - ${y} = ${z} <br>`)

        // perkalian 
        z = x * y
        document.write (`${x} - ${y} = ${z} <br>`)

        // pembagian
        z = x / y 
        document.write (`${x} / ${y} = ${z} <br>`)

        // modulus 
        z = x % y
        document.write (`${x} % ${y} = ${z} <br>`)
    </script>
</body>
</html>
