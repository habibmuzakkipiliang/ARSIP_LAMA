<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Arimatika</title>
</head>
<body>
    <h1>Operator Arimatika</h1>

    <script>
        var a = 14;
        var b = 15;
        var c = 0;

        // penjumlahan
        c = a + b;
        document.write (`${a} + ${b} = ${c} <br>`);

        // pengurangan
        c = a - b;
        document.write (`${a} - ${b} = ${c} <br>`);

        // perkalian
        c = a * b;
        document.write (`${a} * ${b} = ${c} <br>`);

        // pembagian 
        c = a / b;
        document.write (`${a} / ${b} = ${c} <br>`);

        // pangkat 
        c = a ** b;
        document.write (`${a} ** ${b} = ${c} <br>`);

        // modulus 
        c = a % b
        document.write (`${a} % ${b} = ${c} <br>`);
    </script>
</body>
</html>
