<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operator dasar 2</title>
</head>
<body>
    <h1>operator dasar 2</h1>

    <script>
        var x = 100;
        var y = 50;
        var z = 0;

        z = x + y;
        document.write (`${x} + ${y} = ${z} <br>`);

        z = x - y;
        document.write (`${x} - ${y} = ${z} <br>`);

        z = x ** y;
        document.write (`${x} ** ${y} = ${z} <br>`);

        z = x / y;
        document.write (`${x} / ${y} = ${z} <br>`);

        z = x % y;
        document.write (`${x} % ${y} = ${z} <br>`);

        z = x ^ y;
        document.write (`${x} ^ ${y} = ${z} <br>`);
    </script>
</body>
</html>
