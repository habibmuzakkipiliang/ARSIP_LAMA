<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operasi Arimatika Dasar 1</title>
</head>
<body>
    <h1>Operasi Aritmatika Dasar 1</h1>

    <script>
        let a = 12;
        let b = 23
        let c = 0;

        c = a + b;
        document.write (`${a} + ${b} = ${c} <br>`)

        c = a * b;
        document.write (`${a} * ${b} = ${c} <br>`)

        c = a ** b;
        document.write (`${a} ** ${b} = ${c} <br>`)

        c = a / b;
        document.write (`${a} / ${b} = ${c} <br>`)

        c = a % b;
        document.write (`${a} % ${b} = ${c} <br>`)
    </script>
</body>
</html>
