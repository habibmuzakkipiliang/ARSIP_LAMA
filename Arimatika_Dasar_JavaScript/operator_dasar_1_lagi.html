<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator dasar 1 lagi</title>
</head>
<body>
    <h1>Operator dasar 1 lagi</h1>

    <script>
        var k = 23;
        var p = 34;
        var j = 0;
        

        j = k && p;
        document.write (`${k} && ${p} = ${j} <br>`)

        j = k || p;
        document.write (`${k} || ${p} = ${j} <br>`)

        j = k < p;
        document.write (`${k} < ${p} = ${j} <br>`)

        j = k > p;
        document.write (`${k} > ${p} = ${j} <br>`)

        j = k + p;
        document.write (`${k} + ${p} = ${j} <br>`)

        j = k - p;
        document.write (`${k} - ${p} = ${j} <br>`)

        j = k ** p;
        document.write (`${k} ** ${p} = ${j} <br>`)

        j = k * p;
        document.write (`${k} * ${p} = ${j} <br>`)

        j = k % p;
        document.write (`${k} % ${p} = ${j} <br>`)

        j = k / p;
        document.write (`${k} / ${p} = ${j} <br>`)
    </script>
</body>
</html>
