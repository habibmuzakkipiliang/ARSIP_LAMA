<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan JavaScript </title>
</head>
<body>
    <h1 align="center">Latihan JavaScript</h1>
    <p>HARI INI, SAYA SEDANG LATIHAN JAVASCRIPT</p>
    <button id="tambah" onclick="tambahSemangat()">SEMANGAT</button>
    <div id="tambahSemangat"></div>

    <script>
        function tambahSemangat() {
            let a = document.getElementById("tambahSemangat");
            a.innerHTML += "<p>SELALU SEMANGAT DAN PANTANG MENYERAH </p>";
        }
    </script>
</body>
</html>
