<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Button JavaScript</title>
</head>
<body>
    <h1 align="center">Latihan Button JavaScript</h1>
    <p>AYO LATIHAN - LATIHAN BAHASA PEMROGRAMAN JAVASCRIPT</p>
    <button id="latihan" onclick="latihanJS()">REST AREA 260B JALAN TOL PEJAGAN - PEMALANG</button>
    <div id="latihanJS"></div>

    <script>
        function latihanJS() {
            let a = document.getElementById("latihanJS");
            a.innerHTML += "<p>Pabrik Gula Banjaratma atau Suikerfabriek Bandjaratma merupakan perusahaan industri gula yang pernah berdiri di wilayah Kabupaten Brebes. Lokasi Pabrik Gula Banjaratma ini terletak di desa Banjaratma, Bulakamba, Brebes atau yang sekarang ini telah menjadi Rest Area KM 260B Banjaratma.</p>"
            a.innerHTML += "<p>SF Bandjaratma dibangun pada tahun 1908 oleh Handelsvereniging Amsterdam (HVA) yang merupakan perusahaan perkebunan Belanda berpusat di Amsterdam, kemudian dibentuklah N.V. Cultuurmaatschappij Bandjaratma yang bertujuan untuk menjalankan pengoperasian pada perusahaan industri gula Banjaratma. Pabrik gula yang dibangun pada tahun 1908 ini merupakan pabrik gula paling muda yang ada di Kabupaten Brebes. Namun PG Banjaratma ini baru mulai beroperasi di tahun 1913.</p>"
            a.innerHTML += "<p>Pabrik Gula Banjaratma ini dibangun lengkap dengan rumah karyawan pabrik, jalur kereta lori untuk mengangkut tebu, dan beberapa fasilitas lainnya. Jalur kereta lori nya sendiri terhubung juga dengan Pabrik Gula Jatibarang dan Pabrik Gula Ketanggungan Barat. Selain memproduksi gula, SF Bandjaratma ini juga digunakan sebagai Proefstation atau Stasiun pengujian gula.</p>"
            a.innerHTML += "<p>Terdapat juga jalur kereta api yang digunakan untuk membawa hasil distribusi gula PG Banjaratma, jalur kereta api ini dibangun dari hasil kerja sama dengan perusahaan kereta api Hindia Belanda Semarang–Cheribon Stoomtram Maatschappij (SCS). Jalur kereta api ini berasal dari jalur KA Cirebon Prujakan-Tegal yang memiliki percabangan didaerah Klampok yang kemudian menuju ke arah selatan melewati desa Siasem, Sigentong, dan berakhir di Pabrik Gula Banjaratma. Bekas jalur kereta api yang bercabang menuju PG Banjaratma saat ini menjadi Jalan Pabrik Gula Banjaratma.</p>"
            a.innerHTML += "<p>Keberadaan Pabrik Gula Banjaratma ini termuat dalam berbagai peta, buku, dan surat kabar Belanda serta beberapa sumber lain. Berita penerbitan saham baru untuk pendirian Pabrik Gula Banjaratma terdata pada surat kabar Belanda di tahun 1914. Dalam surat kabar De Locomotief yang diterbitkan pada tanggal 19 Mei 1917 terdapat sebuah iklan lowongan pekerjaan sebagai pegawai timbangan tebu di Pabrik Gula Banjaratma.</p>"
        }
    </script>
    <hr>

    <button id="koper" onclick="koperKosong()">INFORMATIKA</button>
    <div id="koperKosong"></div>

    <script>
        function koperKosong() {
            let a = document.getElementById("koperKosong");
            a.innerHTML += "<p>Informatika adalah ilmu yang mempelajari penggunaan komputer untuk mengolah dan menganalisis data. Informatika juga mencakup berbagai aspek teknologi informasi, komputasi, dan perangkat lunak.</p>"
        }
    </script>
    <hr>

    <button id="sma" onclick="smaHebat()">OLIMPIADE INFORMATIKA</button>
    <div id="smaHebat"></div>

    <script>
        function smaHebat() {
            let a = document.getElementById("smaHebat");
            a.innerHTML += "<p>Olimpiade informatika adalah kompetisi pemrograman yang diselenggarakan untuk siswa sekolah menengah. Olimpiade ini dapat diikuti di tingkat nasional maupun internasional.</p>"
        }
    </script>
    <hr>

    <button id="loper" onclick="loperKosong()">BAHASA PEMROGRAMAN</button>
    <div id="loperKosong"></div>

    <script>
        function loperKosong() {
            let a = document.getElementById("loperKosong");
            a.innerHTML += "<p>Bahasa pemrograman adalah bahasa yang digunakan untuk memberikan instruksi kepada komputer. Bahasa pemrograman juga disebut bahasa komputer.</p>"
        }
    </script>
    <hr>

    <button id="hikmah" onclick="hikmahAli()">CODING</button>
    <div id="hikmahAli"></div>

    <script>
        function hikmahAli() {
            let a = document.getElementById("hikmahAli");
            a.innerHTML += "<p>Coding adalah proses menulis instruksi atau kode menggunakan bahasa pemrograman untuk memerintahkan komputer. Dengan coding, kita bisa membuat program komputer, aplikasi, situs web, dan lain-lain.</p>"
        }
    </script>
    <hr>

    <button id="hujan" onclick="hujanBadai()">ALGORITMA</button>
    <div id="hujanBadai"></div>

    <script>
        function hujanBadai() {
            let a = document.getElementById("hujanBadai");
            a.innerHTML += "<p>Algoritma adalah urutan langkah-langkah yang harus diikuti untuk menyelesaikan suatu masalah atau tugas. Algoritma dapat diibaratkan seperti resep masakan yang memberikan petunjuk langkah-langkah untuk membuat hidangan.</p>"
            a.innerHTML += "<p>Dalam konteks pemrograman, algoritma adalah serangkaian instruksi yang diberikan kepada komputer untuk menyelesaikan tugas atau perhitungan. Algoritma merupakan inti dari semua program komputer.</p>"
        }
    </script>
</body>
</html>
