<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan JavaScript 1</title>
</head>
<body>
    <h1 align="center">Latihan JavaScript 1</h1>
    <p>SAYA SEDANG LATIHAN KEDUA JAVASCRIPT</p>
    <button id="harus" onclick="harusSemangat()">SEMANGAT !!</button>
    <div id="harus_semangat"></div>

    <script>
        function harusSemangat() {
            let a = document.getElementById("harus_semangat");
            a.innerHTML += "<p>Informatika adalah ilmu yang mempelajari penggunaan komputer untuk mengolah dan menganalisis data. Informatika juga mencakup berbagai aspek teknologi informasi, komputasi, dan perangkat lunak.</p>";
        }
    </script>
</body>
</html>
