<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan JavaScript 2</title>
</head>
<body>
    <h1 align="center">Latihan JavaScript 2</h1>
    <p>SAYA SEDANG LATIHAN KETIGA JAVASCRIPT</p>
    <button id="pake" onclick="pakeUang()">SEMANGAT !!!</button>
    <div id="pakeUang"></div>

    <script>
        function pakeUang() {
            let a = document.getElementById("pakeUang");
            a.innerHTML += "<p>Pabrik Gula Banjaratma atau Suikerfabriek Bandjaratma merupakan perusahaan industri gula yang pernah berdiri di wilayah Kabupaten Brebes. Lokasi Pabrik Gula Banjaratma ini terletak di desa Banjaratma, Bulakamba, Brebes atau yang sekarang ini telah menjadi Rest Area KM 260B Banjaratma.</p>"
            a.innerHTML += "<p>SF Bandjaratma dibangun pada tahun 1908 oleh Handelsvereniging Amsterdam (HVA) yang merupakan perusahaan perkebunan Belanda berpusat di Amsterdam, kemudian dibentuklah N.V. Cultuurmaatschappij Bandjaratma yang bertujuan untuk menjalankan pengoperasian pada perusahaan industri gula Banjaratma. Pabrik gula yang dibangun pada tahun 1908 ini merupakan pabrik gula paling muda yang ada di Kabupaten Brebes. Namun PG Banjaratma ini baru mulai beroperasi di tahun 1913.</p>"
            a.innerHTML += "<p>Pabrik Gula Banjaratma ini dibangun lengkap dengan rumah karyawan pabrik, jalur kereta lori untuk mengangkut tebu, dan beberapa fasilitas lainnya. Jalur kereta lori nya sendiri terhubung juga dengan Pabrik Gula Jatibarang dan Pabrik Gula Ketanggungan Barat. Selain memproduksi gula, SF Bandjaratma ini juga digunakan sebagai Proefstation atau Stasiun pengujian gula.</p>"
            a.innerHTML += "<p>Terdapat juga jalur kereta api yang digunakan untuk membawa hasil distribusi gula PG Banjaratma, jalur kereta api ini dibangun dari hasil kerja sama dengan perusahaan kereta api Hindia Belanda Semarang–Cheribon Stoomtram Maatschappij (SCS). Jalur kereta api ini berasal dari jalur KA Cirebon Prujakan-Tegal yang memiliki percabangan didaerah Klampok yang kemudian menuju ke arah selatan melewati desa Siasem, Sigentong, dan berakhir di Pabrik Gula Banjaratma. Bekas jalur kereta api yang bercabang menuju PG Banjaratma saat ini menjadi Jalan Pabrik Gula Banjaratma.</p>"
            a.innerHTML += "<p>Keberadaan Pabrik Gula Banjaratma ini termuat dalam berbagai peta, buku, dan surat kabar Belanda serta beberapa sumber lain. Berita penerbitan saham baru untuk pendirian Pabrik Gula Banjaratma terdata pada surat kabar Belanda di tahun 1914. Dalam surat kabar De Locomotief yang diterbitkan pada tanggal 19 Mei 1917 terdapat sebuah iklan lowongan pekerjaan sebagai pegawai timbangan tebu di Pabrik Gula Banjaratma.</p>"
        }
    </script>
</body>
</html>
