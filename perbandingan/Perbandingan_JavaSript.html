<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbandingan JavaScript</title>
</head>
<body>
    <h1></h1>

    <script>
        var aku = 13;
        var kamu = 14;


        var hasil = aku == kamu;
        document.write (`${aku} == ${kamu} = ${hasil} <br>`)

        var hasil = aku > kamu;
        document.write (`${aku} > ${kamu} = ${hasil} <br>`)

        var hasil = aku < kamu;
        document.write (`${aku} < ${kamu} = ${hasil} <br>`)

        var hasil = aku <= kamu;
        document.write (`${aku} <= ${kamu} = ${hasil} <br>`)

        var hasil = aku != kamu;
        document.write (`${aku} != ${kamu} = ${hasil} <br>`)
    </script>
</body>
</html>
