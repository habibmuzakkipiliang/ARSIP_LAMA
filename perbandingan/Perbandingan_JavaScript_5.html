<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Arimatika lagi</title>
</head>
<body>
    <h1>Operator Arimatika lagi</h1>

    <script>
        var anda = 90
        var kalian = 78

        var hasil = anda  == kalian
        document.write (`${anda} > ${kalian} = ${hasil} <br>`)

        var hasil = anda > kalian
        document.write (`${anda} > ${kalian} = ${hasil} <br>`) 

        var hasil = anda < kalian 
        document.write (`${anda} < ${kalian} = ${hasil} <br>`)

        var hasil = anda <= kalian
        document.write (`${anda} <=${kalian} = ${hasil} <br>`)
    </script>
</body>
</html>
