<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function JavaScript Sederhana</title>
</head>
<body>
    <h1>Function JavaScript Sederhana</h1>
    <script>
        // function JavaScript

        function ultimo () {
            document.write ("Hello World" + "<br>")
        }

        ultimo ()
        ultimo ()
        ultimo ()

        document.write ("<br>")

        function namaKamu (namaKamu) {
            document.write ("Halo " + namaKamu + "<br>")
        }

        namaKamu ("SmurfWillow")
        namaKamu ("SmurfLily")
        namaKamu ("SmurfStorm")

        document.write ("<br>")

        function jorongTimur (jorongTimur) {
            document.write ("Hello " + jorongTimur + "<br>")
        }

        jorongTimur ("Sumatera Barat")
        jorongTimur ("Bukittinggi")
        jorongTimur ("Payakumbuh")

        document.write ("<br>")

        function tambah (k, o) {
            return k + o
        }

        var hasil = tambah (5, 6)
        document.write ("tambah = ", hasil + "<br>")


        function kurang (k, l) {
            return k - l
        }

        var hasil = kurang (10, 5)
        document.write ("Kurang = ", hasil + "<br>")

        function pangkat (a, k) {
            return a ** k
        }

        var hasil = pangkat (2, 3)
        document.write ("Pangkat = ", hasil + "<br>")

        document.write ("<br>")
    </script>
</body>
</html>
