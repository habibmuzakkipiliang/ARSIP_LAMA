    <script>
        // Deklarasi Variabel 
        let nama_lengkap = "John Mario Henrino Martiez"
        let warga_negara = "Amerika Serika"
        let asal = "Italia"
        const tinggi = 165
        const berat = 50
        const usia = 25
        var kerja = "Programmer"

        console.log (nama_lengkap, warga_negara, asal, tinggi, berat, usia, kerja)
    </script>

    <script>
        // tipe data JavaScript
        let teks = "Hello World"
        let angka = 10
        let desimal = 1.7
        let boolean = true
        let tidakAda = null
        let tidakTerdefinisi = "not"

        console.log (teks, angka, desimal, boolean, tidakAda, tidakTerdefinisi)
    </script>

    <script>
        // Operator Aritmatika Dasar
        let a = 10
        let b = 45

        console.log (a + b)
        console.log (a - b)
        console.log (a / b)
        console.log (a * b)
        console.log (a ** b)
        console.log (a % b)
    </script>

    <script>
        // Operator Perbandingan
        console.log (5 == "5") // true
        console.log (5 === "5") // false
        console.log (5 != "3") // true
        console.log (5 < "10") // true
        console.log (15 > "10") // true
    </script>

    <script>
        // Operator Logika 
        let x = true
        let y = false

        console.log (x && y) // false
        console.log (x || y) // true
        console.log (! x) // false
    </script>
</body>
