<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Dasar JavaScript</title>
</head>
<body>
    <h1>Latihan Dasar JavaScript</h1>

    <script>
        // Hello World

        document.write ("Hello World" + "<br>")
        console.log ("Hello World" + "<br>")

        // variabel dan tipe data

        let teks = "String"; 
        let angka = 123;
        let desimal = 3.14;
        let list = ["Hukan", "Jukan", "Heuja"] 
        let tuple = ("Api", "Boboiboy", "Kadruax")

        document.write ("String = ", teks, "<br>")
        document.write ("Integer = ", angka, "<br>")
        document.write ("Float = ", desimal, "<br>")
        document.write ("List = ", list, "<br>")
        document.write ("Tuple = ", tuple, "<br>")

        // operator perbandingan

        var a = 12;
        var b = 13;

        document.write ("Hasilnya =", a < b, "<br>")
        document.write ("Hasilnya = ", a > b, "<br>")
        document.write ("Hasilnya =", a == b, "<br>")
        document.write ("Hasilnya = ", a <= b, "<br>")

        // percabangan

        var anka = 34;

        if (anka > 34) {
            document.write ("Besar")
        }

        else if (anka < 34) {
            document.write ("Kecil")
        }

        else {
            document.write ("Sama saja")
        }

        document.write ("<br>")

        // for

        var a = 3;

        for (a = 0; a < 5; a++) {
           document.write ("<br>", "perulangan ke-") 
        }
    </script>
</body>
</html>
