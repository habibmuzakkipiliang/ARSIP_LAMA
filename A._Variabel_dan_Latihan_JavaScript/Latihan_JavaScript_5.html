<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan JavaScript</title>
</head>
<body>
    <h1>Latihan JavaScript</h1>

    <script>
        // hello world

        console.log ("Hello World")

        document.write ("Hello World", "<br>")

        // sintaks javascript

        document.write ("Belajar JavaScript", "<br>")
        document.write (123, "<br>")
        document.write (3.14, "<br>")
        document.write (312,"<br>")

        // tipe data javascript

        let text = "Halo Dunia"; // string
        document.write (text, "<br>")

        let angka = 123; // integer
        document.write (angka, "<br>")

        let desimal = 34; // float
        document.write (desimal, "<br>")

        let array = ["John", "Hujan", "Api"] // array
        document.write (array, "<br>")

        let object = ("Johan", "Rita", "Forklift") // object
        document.write (object, "<br>") 

        let cek = true // boolean
        document.write (cek, "<br>")


        // variabel dan konstanta

        let juja = "Hujan Dor";
        let koper = 34;

        document.write (juja, "<br>")
        document.write (koper, "<br>")

        const phi = 3.14;
        const pai = 22/7;

        document.write (phi, "<br>")
        document.write (pai, "<br>")

        // variabel 

        let nama = "Habib Muzakki";
        let kelas = "12 Agama";
        let umur = 17;
        let alamat = "Jl. KH. Ahmad Dahlan No. 73";

        document.write ("Nama : ", nama, "<br>")
        document.write ("Kelas : ", kelas, "<br>")
        document.write ("Umur : ", umur, "<br>")
        document.write ("Alamat : ", alamat, "<br>")

        // percabangan if else 

        let kol = 34;

        if (kol < 12) {
            document.write("Besar")
        }

        else if (kol < 34) {
            document.write("Sedang")
        }

        else {
            document.write("Kecil")
        }

        // nested

        let kopep = 45;
        let ku = true;

        if (kopep < 34) {
            if (ku) {
                document.write ("Benar")
            }

            else {
                document.write ("Salah")
            }
        }

        else {
            document.write ("Salah")
        }

        // for

        let fko = 34;

        for (fko = 0; fko < 10; fko++) {
            document.write (fko, "<br>")
        }

        let huj = 10;

        while (huj < 15) {
            document.write (huj, "<br>")
            huj++
        }
    </script>
</body>
</html>
