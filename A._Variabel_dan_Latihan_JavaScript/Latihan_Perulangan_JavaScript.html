<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Perulangan JavaScript</title>
</head>
<body>
    <h1 align="center">Latihan Perulangan JavaScript</h1>

    <script>
        // perulangan for

        for (a = 1; a < 10; a++) {
            document.write ("For ke -" + a + "<br>")
        }

        // for 2
        for (b = 1; b < 15; b++) {
            document.write ("For ke - " + b + "<br>")
        }

        // for 3

        for (c = 1; c < 12; c++) {
            document.write ("For ke - " + c + "<br>")
        }

        // perulangan while

        let i = 1;

        while (i < 5) {
            document.write ("While ke - " + i + "<br>"); 
            i++
        }


        // perulangan do - while

        let h = 23;

        do {
            document.write ("do - while adalah " + h + "<br>"); 
            h++ ;
        }

        while (h < 30);
     </script>
</body>
</html>
