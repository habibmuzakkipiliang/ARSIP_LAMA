<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 1</title>
</head>
<body>
    <script>
        let teks = "Hello World";
        let angka = 10;
        let boolean = true;
        let array = [1, 2, 3, 4, 5];
        document.write("Teks: " + teks + "<br>");
        document.write("Angka: " + angka + "<br>");     
        document.write("Boolean: " + boolean + "<br>");
        document.write("Array: " + array.join(", ") + "<br>");
    </script>
</body>
</html>
